name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: '0 0 * * *'}]
  # (optional) Run workflow manually
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Base
          base_indepth: yes
          base_hireable: yes

          # Core
          config_timezone: Asia/Shanghai
          config_octicon: yes
